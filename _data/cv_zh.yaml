    论文发表:
      - title: "RLMuscle: Muscle-Driven Character Animation via Reinforcement Learning"
        authors:
          - "Chunlei Li"
          - "Siyuan Yu"
          - "Yang Gao"
          - "Shuai Li"
          - "Peng Yu"
          - "Aimin Hao"
          - "He Wang"
        date: "在审"
        journal: "IEEE Transactions on Visualization and Computer Graphics"
        url: "https://chunleili.github.io/project-page-rlmuscle/"
        summary: "动机:在大多数三维动画流程中,美术师需要逐块肌肉手工调节激活量,费时费力且缺乏物理真实感。创新点:提出基于一维 Hill 型替代模型训练的强化学习控制器,自动求解每块肌肉的激活量,并以此驱动带 Hill 型纤维约束的 GPU 多重网格 XPBD 体积仿真器,以每帧 18 毫秒驱动含 194 块肌肉的全身模型。"

      - title: "MGPBD: A Multigrid Accelerated Global XPBD Solver"
        authors:
          - "Chunlei Li"
          - "Peng Yu"
          - "Tiantian Liu"
          - "Siyuan Yu"
          - "Yuting Xiao"
          - "Shuai Li"
          - "Aimin Hao"
          - "Yang Gao"
          - "Qinping Zhao"
        date: "2025-08-14"
        journal: "SIGGRAPH"
        doi: "10.1145/3721238.3730720"
        summary: "动机:XPBD 的 Gauss-Seidel 求解器难以消除低频误差,导致高分辨率、高刚度仿真不稳定。创新点:提出全局 UA-AMG 预条件共轭梯度求解器,结合惰性延拓算子复用与轻量近核空间构造,以极低开销显著提升收敛性与稳定性。"

      - title: "Parallel Constraint Graph Partitioning and Coloring for Realtime Soft-Body Cutting"
        authors:
            - "Peng Yu"
            - "Ruiqi Wang"
            - "Chunlei Li"
            - "Yuxuan Li"
            - "Xiao Zhai"
            - "Yuanbo He"
            - "Hongyu Wu"
            - "Aimin Hao"
        date: "2025-04-19"
        journal: "Pacific Graphics"
        doi: "10.2312/pg.20251267"
        summary: "动机:切割会实时改变网格拓扑,使并行 GPU 求解器依赖的预计算约束划分与着色失效。创新点:提出并行约束图重划分与重着色方案,可即时恢复求解器的并行性,实现实时软体切割。"

      - title: "A Unified Particle-Based Solver for non-Newtonian Behaviors Simulation"
        authors:
          - "Chunlei Li"
          - "Yang Gao"
          - "Jiayi He"
          - "Tianwei Cheng"
          - "Shuai Li"
          - "Aimin Hao"
        date: "2023-12-01"
        journal: "IEEE Transactions on Visualization and Computer Graphics"
        doi: "10.1109/TVCG.2023.3341453"
        summary: "动机:泥浆、面团、粘液等非牛顿材料兼具类流体与类固体行为,单一用途的求解器难以统一刻画。创新点:提出统一的 SPH 求解器,其本构模型平滑覆盖粘性、弹性与塑性区间,在同一框架内再现剪切变稀/变稠及粘弹性效果。"

      - title: "Comparison between Two Eulerian-Lagrangian Methods: CFD-DEM & MPPIC on the biomass gasification in a fluidized bed"
        authors:
          - "Chunlei Li"
          - "Qitai Eri"
        date: "2021-02-25"
        journal: "Biomass Conversion and Biorefinery"
        doi: "10.1007/s13399-021-01384-2"

      - title: "Comparative Study of Three Modified sCO2 Brayton Recompression Cycles Based on Energy and Exergy Analysis with GA Optimization"
        authors:
          - "Chunlei Li"
          - "Qitai Eri"
        date: "2021-01-15"
        journal: "International Journal of Exergy"
        doi: "10.1504/IJEX.2021.115652"

      - title: "Multi-objective Optimization of sCO₂, sCO₂/tCO₂ Cycles Based on Energy-Exergy-Economy Balanced Analysis"
        authors:
          - "Chunlei Li"
          - "Qitai Eri"
        date: "2022-04-19"
        journal: "International Journal of Exergy"
        doi: "10.1504/IJEX.2022.122308"



